name: CI

on:
  push:
  pull_request:

jobs:
  news-video:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/news-video
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/news-video/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  remotion-explainer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/remotion-explainer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/remotion-explainer/package-lock.json
      - run: npm ci
      - run: npm run lint
